name: Backend CI
on:
  push:
    # phase31/development is the default branch; merges to it must be built.
    branches: [main, master, 'phase31/development', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: backend (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Pinned to the two Node 22 releases that bracket the source-mode worker regression (fixed in B35.1): 22.22.0 failed 55 tests before
        # the fix; 22.23.2 passed. Both are within engines ">=22". Add newer lines deliberately, once they are verified.
        node: ['22.22.0', '22.23.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Embedded PostgreSQL (integration and migration-replay suites) runs as the non-root runner user and needs this locale.
      - run: sudo locale-gen en_US.UTF-8
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      # The complete Vitest suite (every file vitest.config.ts includes: unit, integration, migration replay, worker pools, jobs,
      # references, account, verification and engineering). It replaces the earlier per-area subsets, which omitted several suites.
      - run: npx vitest run
        env:
          LANG: en_US.UTF-8
      - if: matrix.node == '22.23.2'
        run: docker build -t designflow-api:ci .
      - if: matrix.node == '22.23.2'
        run: node scripts/smoke-container.mjs designflow-api:ci
  # Explicit opt-in release gate: runs only against an ephemeral local Docker stack.
  supabase-acceptance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1
      - run: npx supabase db reset --local
      - run: node scripts/ensure-local-postgrest.mjs
      - run: node scripts/test-local-supabase.mjs
      - if: always()
        run: npx supabase stop --no-backup
