name: Backend CI
on:
  push:
    # phase31/development is the active development branch; merges into it must be built.
    branches: [main, master, 'phase31/development', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A pull request shares one group, so a new push cancels its superseded run. Every other event gets its own group
  # (run_id): within a shared group GitHub cancels an older *pending* run even without cancel-in-progress, which would
  # drop the result for one of several quick merges into phase31/development.
  group: backend-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  backend:
    name: backend (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Both within engines ">=22". 22.22.0 is the release that exposed the source-mode worker regression; 22.23.3 is the
        # release CI last resolved for '22' (run 38359376575). Pinned so results are reproducible; add newer lines deliberately.
        node: ['22.22.0', '22.23.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Embedded PostgreSQL (integration and migration-replay suites) runs as the non-root runner user and needs this locale.
      - run: sudo locale-gen en_US.UTF-8
      - run: npm ci
      # Production dependency advisories (high and above) fail the job.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      # Every file vitest.config.ts includes: unit, integration (embedded PostgreSQL), migration replay, worker pools, jobs,
      # compute, references, account, verification and repair suites. It replaces the per-area subsets, which omitted 15 files.
      # supabase.live.test.ts needs a real Supabase stack and stays excluded by that config (see supabase-acceptance below).
      - run: npx vitest run
  # The production image builds itself (npm ci and build inside the Dockerfile) and its Node version comes from the Dockerfile,
  # so it is built and smoke-tested once, in its own job and check, independent of the test matrix.
  container:
    name: container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The smoke script runs on the host and uses only Node built-ins.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: docker build -t designflow-api:ci .
      - run: node scripts/smoke-container.mjs designflow-api:ci
  # Explicit opt-in release gate: runs only against an ephemeral local Docker stack.
  supabase-acceptance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1
      - run: npx supabase db reset --local
      - run: node scripts/ensure-local-postgrest.mjs
      - run: node scripts/test-local-supabase.mjs
      - if: always()
        run: npx supabase stop --no-backup
