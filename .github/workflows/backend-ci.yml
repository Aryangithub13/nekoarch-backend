name: Backend CI
on:
  push:
    # phase31/development is the active development branch; merges into it must be built.
    branches: [main, master, 'phase31/development', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; branch pushes are not, so every merged commit keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  backend:
    name: backend (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Both within engines ">=22". 22.22.0 is the release that exposed the source-mode worker regression; 22.23.3 is the
        # release CI last resolved for '22' (run 38359376575). Pinned so results are reproducible; add newer lines deliberately.
        node: ['22.22.0', '22.23.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      # Every file vitest.config.ts includes: unit, integration (embedded PostgreSQL), migration replay, worker pools, jobs,
      # compute, references, account, verification and repair suites. It replaces the per-area subsets, which omitted 15 files.
      # supabase.live.test.ts needs a real Supabase stack and stays excluded by that config (see supabase-acceptance below).
      - run: npx vitest run
      # The image's Node version comes from the Dockerfile, not the matrix, so build and smoke-test it once.
      - if: matrix.node == '22.23.3'
        run: docker build -t designflow-api:ci .
      - if: matrix.node == '22.23.3'
        run: node scripts/smoke-container.mjs designflow-api:ci
  # Explicit opt-in release gate: runs only against an ephemeral local Docker stack.
  supabase-acceptance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1
      - run: npx supabase db reset --local
      - run: node scripts/ensure-local-postgrest.mjs
      - run: node scripts/test-local-supabase.mjs
      - if: always()
        run: npx supabase stop --no-backup
